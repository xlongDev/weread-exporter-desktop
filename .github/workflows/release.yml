name: Release 构建

on:
  workflow_dispatch: {}          # 手动触发
  push:
    tags: ["v*"]                 # 推送 v* tag 自动构建

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest     # Apple Silicon（macos-14 镜像已退役，任务被自动取消）
            target: aarch64-apple-darwin
            label: macos-arm64
          # Intel 版不进 CI（macos-13 runner 容量枯竭，排队 40 分钟+）：
          # 本地交叉构建（TAURI_TARGET=x86_64-apple-darwin npx tauri build --target x86_64-apple-darwin），
          # 产物见仓库 dist/ 或 Release 附带文件。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Windows 系统依赖（WebView2 由 runner 预装）
        if: matrix.os == 'windows-latest'
        run: echo "runner 自带 WebView2 与 MSVC"
      - name: 前端依赖
        working-directory: apps/desktop
        run: npm install
      - name: 组装捆绑运行时 + 生产构建
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: npx tauri build --target ${{ matrix.target }}
      # macOS：runtime 资源由 prepare-runtime.sh 组装（支持 TAURI_TARGET）；
      # Windows：prepare-runtime.sh 走 x86_64-windows 分支下载 python-build-standalone
      - name: 收集产物 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp -R "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg dist/
      - name: 收集产物 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/ || \
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi dist/
      - uses: actions/upload-artifact@v4
        with:
          name: weread-exporter-${{ matrix.label }}
          path: dist/*
      - name: 挂载到 GitHub Release（tag 触发时；不存在则自动创建）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --clobber 2>/dev/null || {
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --generate-notes --title "${GITHUB_REF_NAME}"
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          }
