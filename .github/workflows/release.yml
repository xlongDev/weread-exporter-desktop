name: Release 构建

on:
  workflow_dispatch: {}          # 手动触发
  push:
    tags: ["v*"]                 # 推送 v* tag 自动构建

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # Apple Silicon
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-13         # Intel
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Windows 系统依赖（WebView2 由 runner 预装）
        if: matrix.os == 'windows-latest'
        run: echo "runner 自带 WebView2 与 MSVC"
      - name: 前端依赖
        working-directory: apps/desktop
        run: npm install
      - name: 组装捆绑运行时 + 生产构建
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: npx tauri build --target ${{ matrix.target }}
      # macOS：runtime 资源由 prepare-runtime.sh 组装（支持 TAURI_TARGET）；
      # Windows：prepare-runtime.sh 走 x86_64-windows 分支下载 python-build-standalone
      - name: 收集产物 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp -R "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg dist/
      - name: 收集产物 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/ || \
          cp apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi dist/
      - uses: actions/upload-artifact@v4
        with:
          name: weread-exporter-${{ matrix.label }}
          path: dist/*
